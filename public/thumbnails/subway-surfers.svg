<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="subwaySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="40%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="trainRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="goldCoin" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="250" fill="url(#subwaySky)" />

  <!-- Track Perspective -->
  <polygon points="180,90 220,90 380,250 20,250" fill="#334155" />
  
  <!-- Rails -->
  <line x1="185" y1="90" x2="60" y2="250" stroke="#94a3b8" stroke-width="3" />
  <line x1="195" y1="90" x2="140" y2="250" stroke="#94a3b8" stroke-width="2" />
  <line x1="205" y1="90" x2="260" y2="250" stroke="#94a3b8" stroke-width="2" />
  <line x1="215" y1="90" x2="340" y2="250" stroke="#94a3b8" stroke-width="3" />

  <!-- Ties (Sleepers) -->
  <g stroke="#1e293b" stroke-width="3" opacity="0.7">
    <line x1="180" y1="105" x2="220" y2="105" />
    <line x1="170" y1="125" x2="230" y2="125" />
    <line x1="155" y1="150" x2="245" y2="150" />
    <line x1="130" y1="180" x2="270" y2="180" />
    <line x1="95" y1="215" x2="305" y2="215" />
  </g>

  <!-- Train on Right Track -->
  <g transform="translate(230, 80)">
    <polygon points="15,0 80,0 120,150 15,150" fill="url(#trainRed)" stroke="#7f1d1d" stroke-width="2" />
    <rect x="25" y="20" width="40" height="25" fill="#38bdf8" opacity="0.8" rx="2" />
    <!-- Headlight -->
    <circle cx="35" cy="110" r="10" fill="#fef08a" />
    <circle cx="35" cy="110" r="16" fill="#fef08a" opacity="0.3" />
  </g>

  <!-- Floating Gold Coins -->
  <g transform="translate(160, 150)">
    <circle cx="0" cy="0" r="12" fill="#eab308" stroke="#fef08a" stroke-width="2" />
    <text x="0" y="4" fill="#713f12" font-size="11" font-family="sans-serif" font-weight="900" text-anchor="middle">★</text>
  </g>
  <g transform="translate(170, 125)">
    <circle cx="0" cy="0" r="9" fill="#eab308" stroke="#fef08a" stroke-width="1.5" />
  </g>
  <g transform="translate(180, 105)">
    <circle cx="0" cy="0" r="7" fill="#eab308" stroke="#fef08a" stroke-width="1" />
  </g>

  <!-- Surfer Jake with Cap & Hoverboard -->
  <g transform="translate(125, 130)">
    <!-- Hoverboard -->
    <ellipse cx="20" cy="95" rx="36" ry="8" fill="#f97316" stroke="#fbbf24" stroke-width="2" />
    <!-- Jet particles -->
    <circle cx="0" cy="100" r="4" fill="#38bdf8" opacity="0.8" />
    <circle cx="-10" cy="103" r="3" fill="#60a5fa" opacity="0.6" />

    <!-- Legs -->
    <rect x="10" y="55" width="8" height="35" rx="3" fill="#1d4ed8" transform="rotate(-10)" />
    <rect x="22" y="55" width="8" height="35" rx="3" fill="#1d4ed8" transform="rotate(15)" />
    <!-- Shoes -->
    <rect x="4" y="85" width="16" height="8" rx="3" fill="#ef4444" />
    <rect x="28" y="85" width="16" height="8" rx="3" fill="#ef4444" />

    <!-- Hoodie / Jacket -->
    <rect x="6" y="24" width="28" height="32" rx="4" fill="#0284c7" />
    <rect x="16" y="24" width="8" height="32" fill="#ffffff" />

    <!-- Head & Backwards Red Cap -->
    <circle cx="20" cy="14" r="12" fill="#fed7aa" />
    <!-- Cap visor facing backwards -->
    <path d="M 8 10 Q 20 2 32 10 L 32 16 L 4 16 Z" fill="#dc2626" />
    <polygon points="4,14 -4,12 2,18" fill="#dc2626" />
  </g>

  <!-- Title Badge -->
  <rect x="14" y="14" width="165" height="28" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#f97316" stroke-width="2" />
  <text x="96" y="33" fill="#f97316" font-size="13" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">SUBWAY SURFERS</text>

  <rect x="300" y="14" width="86" height="22" rx="4" fill="#c2410c" fill-opacity="0.8" stroke="#fb923c" stroke-width="1" />
  <text x="343" y="29" fill="#ffedd5" font-size="10" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">REAL GAME</text>
</svg>
