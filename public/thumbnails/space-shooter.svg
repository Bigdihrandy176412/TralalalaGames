<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <radialGradient id="nebula" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#1e1b4b" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <filter id="laserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38bdf8" flood-opacity="0.9"/>
    </filter>
    <filter id="alienGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#f43f5e" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="400" height="250" fill="#030712" />
  <rect width="400" height="250" fill="url(#nebula)" />

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="25" cy="40" r="1" opacity="0.8" />
    <circle cx="80" cy="15" r="1.5" opacity="0.9" />
    <circle cx="140" cy="55" r="0.8" opacity="0.5" />
    <circle cx="200" cy="20" r="1.2" opacity="0.7" />
    <circle cx="260" cy="65" r="0.8" opacity="0.6" />
    <circle cx="340" cy="30" r="1.5" opacity="0.8" />
    <circle cx="380" cy="80" r="1" opacity="0.5" />
    <circle cx="45" cy="110" r="0.8" opacity="0.6" />
    <circle cx="110" cy="160" r="1.2" opacity="0.7" />
    <circle cx="310" cy="140" r="0.8" opacity="0.5" />
    <circle cx="365" cy="190" r="1.4" opacity="0.9" />
    <circle cx="65" cy="210" r="1" opacity="0.7" />
  </g>

  <!-- Alien Fleet (Space Invaders) -->
  <!-- Row 1: Red Boss Invaders -->
  <g filter="url(#alienGlow)" fill="#f43f5e">
    <!-- Alien 1 -->
    <path d="M 70 45 L 80 45 L 85 55 L 75 60 L 65 55 Z" />
    <circle cx="72" cy="50" r="2" fill="#fff" />
    <circle cx="78" cy="50" r="2" fill="#fff" />

    <!-- Alien 2 -->
    <path d="M 140 45 L 150 45 L 155 55 L 145 60 L 135 55 Z" />
    <circle cx="142" cy="50" r="2" fill="#fff" />
    <circle cx="148" cy="50" r="2" fill="#fff" />

    <!-- Alien 3 (Center) -->
    <path d="M 205 40 L 225 40 L 230 55 L 215 62 L 200 55 Z" />
    <circle cx="210" cy="48" r="2.5" fill="#fde047" />
    <circle cx="220" cy="48" r="2.5" fill="#fde047" />

    <!-- Alien 4 -->
    <path d="M 275 45 L 285 45 L 290 55 L 280 60 L 270 55 Z" />
    <circle cx="277" cy="50" r="2" fill="#fff" />
    <circle cx="283" cy="50" r="2" fill="#fff" />

    <!-- Alien 5 -->
    <path d="M 335 45 L 345 45 L 350 55 L 340 60 L 330 55 Z" />
    <circle cx="337" cy="50" r="2" fill="#fff" />
    <circle cx="343" cy="50" r="2" fill="#fff" />
  </g>

  <!-- Row 2: Purple / Cyan Invaders -->
  <g fill="#a855f7">
    <path d="M 90 85 L 105 85 L 110 95 L 98 100 L 85 95 Z" />
    <path d="M 160 85 L 175 85 L 180 95 L 168 100 L 155 95 Z" />
    <!-- Exploding Alien (Just Hit by laser) -->
    <g transform="translate(230, 90)">
      <circle cx="0" cy="0" r="14" fill="#fbbf24" opacity="0.8" />
      <circle cx="0" cy="0" r="8" fill="#ffffff" />
      <path d="M -15 -10 L -5 -5 L -8 -15 Z" fill="#f97316" />
      <path d="M 12 -12 L 6 -4 L 14 -2 Z" fill="#f97316" />
      <path d="M -10 12 L -4 5 L -12 6 Z" fill="#f97316" />
      <path d="M 10 10 L 4 5 L 8 14 Z" fill="#f97316" />
    </g>
    <path d="M 295 85 L 310 85 L 315 95 L 303 100 L 290 95 Z" />
  </g>

  <!-- Dual Laser Blasts -->
  <g filter="url(#laserGlow)" fill="#38bdf8">
    <rect x="194" y="125" width="4" height="24" rx="2" />
    <rect x="212" y="125" width="4" height="24" rx="2" />
    <!-- Higher beam that hit the alien -->
    <rect x="228" y="105" width="4" height="20" rx="2" />
  </g>

  <!-- Player Spaceship -->
  <g transform="translate(205, 195)">
    <!-- Thruster Flame -->
    <path d="M -6 22 Q 0 38 6 22 Z" fill="#f97316" />
    <path d="M -3 22 Q 0 32 3 22 Z" fill="#fef08a" />

    <!-- Ship Hull -->
    <path d="M 0 -24 L 18 18 L 10 22 L 0 16 L -10 22 L -18 18 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <!-- Cockpit Glass -->
    <ellipse cx="0" cy="-2" rx="4" ry="10" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
    <!-- Wing Guns -->
    <rect x="-19" y="0" width="3" height="15" rx="1" fill="#cbd5e1" />
    <rect x="16" y="0" width="3" height="15" rx="1" fill="#cbd5e1" />
  </g>

  <!-- HUD -->
  <text x="25" y="24" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="800">WAVE 04</text>
  <text x="375" y="24" fill="#facc15" font-family="monospace" font-size="11" font-weight="800" text-anchor="end">SCORE 12,450</text>
</svg>
