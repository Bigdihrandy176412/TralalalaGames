<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="stadiumGrass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="50%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="50%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#431407" />
    </linearGradient>
    <filter id="retroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#020617" />
    </filter>
  </defs>

  <!-- Stadium Field -->
  <rect width="400" height="250" fill="url(#stadiumGrass)" />

  <!-- Field Yard Stripes (Retro Pixel Grid Style) -->
  <rect x="0" y="30" width="400" height="35" fill="#166534" />
  <rect x="0" y="100" width="400" height="35" fill="#166534" />
  <rect x="0" y="170" width="400" height="35" fill="#166534" />

  <!-- Yard Lines -->
  <line x1="0" y1="30" x2="400" y2="30" stroke="#f8fafc" stroke-width="2" opacity="0.6" />
  <line x1="0" y1="65" x2="400" y2="65" stroke="#f8fafc" stroke-width="2" opacity="0.6" />
  <line x1="0" y1="100" x2="400" y2="100" stroke="#f8fafc" stroke-width="2" opacity="0.6" />
  <line x1="0" y1="135" x2="400" y2="135" stroke="#f8fafc" stroke-width="2" opacity="0.6" />
  <line x1="0" y1="170" x2="400" y2="170" stroke="#f8fafc" stroke-width="2" opacity="0.6" />
  <line x1="0" y1="205" x2="400" y2="205" stroke="#f8fafc" stroke-width="2" opacity="0.6" />

  <!-- Hash marks -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.5">
    <line x1="120" y1="45" x2="130" y2="45" />
    <line x1="120" y1="80" x2="130" y2="80" />
    <line x1="120" y1="115" x2="130" y2="115" />
    <line x1="120" y1="150" x2="130" y2="150" />
    <line x1="120" y1="185" x2="130" y2="185" />
    
    <line x1="270" y1="45" x2="280" y2="45" />
    <line x1="270" y1="80" x2="280" y2="80" />
    <line x1="270" y1="115" x2="280" y2="115" />
    <line x1="270" y1="150" x2="280" y2="150" />
    <line x1="270" y1="185" x2="280" y2="185" />
  </g>

  <!-- Pixel Quarterback (Blue team) -->
  <g transform="translate(90, 90)" filter="url(#retroShadow)">
    <!-- Helmet -->
    <rect x="8" y="0" width="16" height="14" fill="#3b82f6" />
    <rect x="18" y="4" width="8" height="6" fill="#f8fafc" />
    <!-- Face mask -->
    <rect x="22" y="7" width="5" height="3" fill="#cbd5e1" />
    <!-- Jersey Body -->
    <rect x="4" y="14" width="24" height="24" fill="#1d4ed8" />
    <text x="16" y="32" fill="#ffffff" font-size="14" font-family="monospace" font-weight="900" text-anchor="middle">7</text>
    <!-- Legs -->
    <rect x="6" y="38" width="8" height="20" fill="#f8fafc" />
    <rect x="18" y="38" width="8" height="20" fill="#f8fafc" />
    <!-- Cleats -->
    <rect x="4" y="54" width="10" height="6" fill="#0f172a" />
    <rect x="18" y="54" width="10" height="6" fill="#0f172a" />
    <!-- Arm throwing -->
    <rect x="26" y="16" width="16" height="7" fill="#fbcfe8" />
  </g>

  <!-- Pass Arc Trajectory (Dotted line) -->
  <path d="M 140 100 Q 200 40 260 90" stroke="#facc15" stroke-width="3" stroke-dasharray="6 6" fill="none" />

  <!-- Pixel Wide Receiver (Catching in end zone) -->
  <g transform="translate(260, 80)" filter="url(#retroShadow)">
    <!-- Helmet -->
    <rect x="8" y="0" width="16" height="14" fill="#3b82f6" />
    <rect x="6" y="4" width="6" height="6" fill="#f8fafc" />
    <!-- Face mask -->
    <rect x="3" y="7" width="5" height="3" fill="#cbd5e1" />
    <!-- Jersey Body -->
    <rect x="4" y="14" width="24" height="24" fill="#1d4ed8" />
    <text x="16" y="32" fill="#ffffff" font-size="14" font-family="monospace" font-weight="900" text-anchor="middle">88</text>
    <!-- Legs Running -->
    <rect x="2" y="38" width="8" height="18" fill="#f8fafc" />
    <rect x="20" y="38" width="8" height="16" fill="#f8fafc" />
    <rect x="0" y="52" width="10" height="6" fill="#0f172a" />
    <rect x="22" y="50" width="10" height="6" fill="#0f172a" />
    <!-- Reaching arms -->
    <rect x="-8" y="12" width="14" height="7" fill="#fbcfe8" />
    <rect x="26" y="12" width="14" height="7" fill="#fbcfe8" />
  </g>

  <!-- Giant Retro Football Banner / Center Badge -->
  <g transform="translate(195, 60) rotate(-25)">
    <ellipse cx="0" cy="0" rx="20" ry="12" fill="url(#leatherGrad)" stroke="#f8fafc" stroke-width="1.5" />
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#ffffff" stroke-width="2" />
    <line x1="-6" y1="-4" x2="-6" y2="4" stroke="#ffffff" stroke-width="1.5" />
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#ffffff" stroke-width="1.5" />
    <line x1="6" y1="-4" x2="6" y2="4" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Title Badge -->
  <rect x="14" y="14" width="130" height="28" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
  <text x="79" y="33" fill="#f59e0b" font-size="13" font-family="monospace" font-weight="900" text-anchor="middle" letter-spacing="1">RETRO BOWL</text>

  <rect x="295" y="14" width="90" height="22" rx="4" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1" />
  <text x="340" y="29" fill="#93c5fd" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">OFFICIAL</text>
</svg>
