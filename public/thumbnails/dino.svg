<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="desertSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Sky Canvas -->
  <rect width="400" height="250" fill="url(#desertSky)" />

  <!-- Pixel Sun / Moon in corner -->
  <circle cx="340" cy="45" r="18" fill="#facc15" opacity="0.85" />

  <!-- Pixel Clouds -->
  <g fill="#64748b" opacity="0.6">
    <path d="M 60 40 h 30 v 6 h -30 z M 50 46 h 50 v 6 h -50 z M 55 52 h 35 v 4 h -35 z" />
    <path d="M 210 60 h 26 v 5 h -26 z M 200 65 h 45 v 5 h -45 z M 206 70 h 30 v 4 h -30 z" />
  </g>

  <!-- Pterodactyl flying in sky -->
  <g transform="translate(290, 85)" fill="#f8fafc">
    <!-- Body -->
    <rect x="0" y="8" width="16" height="5" />
    <!-- Beak -->
    <polygon points="16,8 24,10 16,12" />
    <!-- Flapping Wings Up -->
    <polygon points="4,8 10,-4 14,8" />
    <circle cx="15" cy="9" r="1" fill="#0f172a" />
  </g>

  <!-- Ground Line with rugged pixel dirt texture -->
  <line x1="0" y1="185" x2="400" y2="185" stroke="#94a3b8" stroke-width="2" />
  <g fill="#64748b">
    <rect x="30" y="189" width="8" height="2" />
    <rect x="75" y="193" width="14" height="2" />
    <rect x="140" y="188" width="10" height="2" />
    <rect x="190" y="192" width="6" height="2" />
    <rect x="250" y="189" width="18" height="2" />
    <rect x="320" y="194" width="12" height="2" />
    <rect x="370" y="190" width="8" height="2" />
  </g>

  <!-- Pixel Dino (Jumping in the air over cacti!) -->
  <g transform="translate(85, 112)" fill="#38bdf8">
    <!-- Head & Snout -->
    <rect x="18" y="0" width="22" height="16" rx="1" />
    <!-- Eye cutout -->
    <rect x="24" y="3" width="3" height="3" fill="#0f172a" />
    <!-- Teeth / Snout opening -->
    <rect x="36" y="12" width="6" height="3" fill="#0f172a" />
    <!-- Neck -->
    <rect x="14" y="14" width="12" height="10" />
    <!-- Body -->
    <rect x="4" y="22" width="24" height="18" rx="2" />
    <!-- Little Dino Arm -->
    <rect x="26" y="26" width="6" height="3" fill="#38bdf8" />
    <rect x="30" y="29" width="2" height="3" fill="#38bdf8" />
    <!-- Tail -->
    <polygon points="4,24 -8,22 4,34" />
    <!-- Bent Legs (Jumping pose) -->
    <rect x="8" y="40" width="4" height="8" />
    <rect x="6" y="46" width="6" height="3" />
    <rect x="18" y="38" width="4" height="6" />
    <rect x="20" y="42" width="6" height="3" />
  </g>

  <!-- Cactus Obstacles on Ground -->
  <!-- Cactus 1 (Tall) -->
  <g transform="translate(195, 140)" fill="#10b981">
    <!-- Main stem -->
    <rect x="8" y="0" width="8" height="45" rx="2" />
    <!-- Left arm -->
    <rect x="0" y="12" width="8" height="5" rx="1" />
    <rect x="0" y="5" width="5" height="12" rx="1" />
    <!-- Right arm -->
    <rect x="16" y="18" width="8" height="5" rx="1" />
    <rect x="19" y="10" width="5" height="13" rx="1" />
  </g>

  <!-- Cactus 2 (Short double cluster) -->
  <g transform="translate(225, 152)" fill="#10b981">
    <!-- Main stem -->
    <rect x="6" y="0" width="7" height="33" rx="2" />
    <rect x="0" y="10" width="6" height="4" />
    <rect x="0" y="4" width="4" height="10" />
    <!-- Second small cactus -->
    <rect x="18" y="8" width="6" height="25" rx="1" />
  </g>

  <!-- Next oncoming cactus in distance -->
  <g transform="translate(350, 148)" fill="#059669">
    <rect x="6" y="0" width="7" height="37" rx="2" />
    <rect x="13" y="12" width="6" height="4" />
    <rect x="15" y="6" width="4" height="10" />
  </g>

  <!-- Score HUD -->
  <text x="375" y="30" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="900" text-anchor="end">HI 04280  <tspan fill="#38bdf8">01954</tspan></text>
</svg>
