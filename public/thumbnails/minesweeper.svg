<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <!-- 3D Bevel effect for unrevealed tiles -->
    <linearGradient id="tileRaised" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="mineShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="#0f172a" />

  <!-- Minesweeper Window Frame -->
  <rect x="50" y="20" width="300" height="210" rx="8" fill="#1e293b" stroke="#334155" stroke-width="3" />

  <!-- Header Bar -->
  <rect x="62" y="32" width="276" height="38" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

  <!-- Mines Counter Display (Digital 7-segment style) -->
  <rect x="70" y="38" width="55" height="26" fill="#000000" rx="3" />
  <text x="97" y="57" fill="#ef4444" font-family="monospace" font-size="18" font-weight="900" text-anchor="middle">012</text>

  <!-- Smiley Face Button -->
  <circle cx="200" cy="51" r="14" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
  <!-- Cool Sunglasses on Smiley -->
  <path d="M 191 47 L 209 47 L 207 54 L 193 54 Z" fill="#0f172a" />
  <path d="M 194 57 Q 200 62 206 57" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Timer Display -->
  <rect x="275" y="38" width="55" height="26" fill="#000000" rx="3" />
  <text x="302" y="57" fill="#ef4444" font-family="monospace" font-size="18" font-weight="900" text-anchor="middle">085</text>

  <!-- Minesweeper Grid -->
  <g transform="translate(62, 78)">
    <!-- 8 columns x 5 rows of 32x26 tiles -->
    <!-- Row 0: Revealed tiles with numbers -->
    <rect x="0" y="0" width="32" height="26" fill="#334155" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="19" fill="#38bdf8" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" text-anchor="middle">1</text>

    <rect x="34" y="0" width="32" height="26" fill="#334155" stroke="#1e293b" stroke-width="1" />
    <text x="50" y="19" fill="#4ade80" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" text-anchor="middle">2</text>

    <rect x="68" y="0" width="32" height="26" fill="#334155" stroke="#1e293b" stroke-width="1" />
    <text x="84" y="19" fill="#ef4444" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" text-anchor="middle">1</text>

    <rect x="102" y="0" width="32" height="26" fill="#334155" stroke="#1e293b" stroke-width="1" />
    <!-- Empty revealed (0) -->

    <rect x="136" y="0" width="32" height="26" fill="#334155" stroke="#1e293b" stroke-width="1" />
    <!-- Empty revealed (0) -->

    <rect x="170" y="0" width="32" height="26" fill="#334155" stroke="#1e293b" stroke-width="1" />
    <text x="186" y="19" fill="#38bdf8" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" text-anchor="middle">1</text>

    <!-- Flagged Tile -->
    <rect x="204" y="0" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />
    <!-- Red Flag -->
    <path d="M 218 5 L 226 9 L 218 13 Z" fill="#ef4444" />
    <line x1="218" y1="5" x2="218" y2="20" stroke="#f8fafc" stroke-width="2" />
    <line x1="214" y1="20" x2="223" y2="20" stroke="#f8fafc" stroke-width="2" />

    <rect x="238" y="0" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />

    <!-- Row 1 -->
    <rect x="0" y="28" width="32" height="26" fill="#334155" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="47" fill="#38bdf8" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" text-anchor="middle">1</text>

    <!-- Exploded / Discovered Mine! -->
    <rect x="34" y="28" width="32" height="26" fill="#475569" stroke="#1e293b" stroke-width="1" />
    <!-- Black spiked naval mine -->
    <circle cx="50" cy="41" r="7" fill="#0f172a" />
    <line x1="40" y1="41" x2="60" y2="41" stroke="#0f172a" stroke-width="2" />
    <line x1="50" y1="31" x2="50" y2="51" stroke="#0f172a" stroke-width="2" />
    <line x1="43" y1="34" x2="57" y2="48" stroke="#0f172a" stroke-width="2" />
    <line x1="43" y1="48" x2="57" y2="34" stroke="#0f172a" stroke-width="2" />
    <circle cx="48" cy="39" r="1.5" fill="#ffffff" />

    <rect x="68" y="28" width="32" height="26" fill="#334155" stroke="#1e293b" stroke-width="1" />
    <text x="84" y="47" fill="#fbbf24" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" text-anchor="middle">3</text>

    <rect x="102" y="28" width="32" height="26" fill="#334155" stroke="#1e293b" stroke-width="1" />
    <text x="118" y="47" fill="#38bdf8" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" text-anchor="middle">1</text>

    <rect x="136" y="28" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />
    <rect x="170" y="28" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />
    <rect x="204" y="28" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />
    <rect x="238" y="28" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />

    <!-- Row 2 -->
    <rect x="0" y="56" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />
    <rect x="34" y="56" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />
    <rect x="68" y="56" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />
    <rect x="102" y="56" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />
    <!-- Another Flagged Tile -->
    <rect x="136" y="56" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />
    <path d="M 150 61 L 158 65 L 150 69 Z" fill="#ef4444" />
    <line x1="150" y1="61" x2="150" y2="76" stroke="#f8fafc" stroke-width="2" />
    <line x1="146" y1="76" x2="155" y2="76" stroke="#f8fafc" stroke-width="2" />

    <rect x="170" y="56" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />
    <rect x="204" y="56" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />
    <rect x="238" y="56" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />

    <!-- Row 3 -->
    <rect x="0" y="84" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />
    <rect x="34" y="84" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />
    <rect x="68" y="84" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />
    <rect x="102" y="84" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />
    <rect x="136" y="84" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />
    <rect x="170" y="84" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />
    <rect x="204" y="84" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />
    <rect x="238" y="84" width="32" height="26" fill="url(#tileRaised)" stroke="#475569" stroke-width="1" rx="2" />
  </g>
</svg>
