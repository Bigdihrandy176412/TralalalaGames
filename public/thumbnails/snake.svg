<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <radialGradient id="foodGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#cc0033" />
    </radialGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#10b981" flood-opacity="0.8"/>
    </filter>
    <filter id="appleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f43f5e" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="250" fill="#030712" />

  <!-- Grid Pattern -->
  <g stroke="#111827" stroke-width="1">
    <line x1="0" y1="25" x2="400" y2="25" />
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="75" x2="400" y2="75" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="125" x2="400" y2="125" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="175" x2="400" y2="175" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="225" x2="400" y2="225" />
    
    <line x1="25" y1="0" x2="25" y2="250" />
    <line x1="50" y1="0" x2="50" y2="250" />
    <line x1="75" y1="0" x2="75" y2="250" />
    <line x1="100" y1="0" x2="100" y2="250" />
    <line x1="125" y1="0" x2="125" y2="250" />
    <line x1="150" y1="0" x2="150" y2="250" />
    <line x1="175" y1="0" x2="175" y2="250" />
    <line x1="200" y1="0" x2="200" y2="250" />
    <line x1="225" y1="0" x2="225" y2="250" />
    <line x1="250" y1="0" x2="250" y2="250" />
    <line x1="275" y1="0" x2="275" y2="250" />
    <line x1="300" y1="0" x2="300" y2="250" />
    <line x1="325" y1="0" x2="325" y2="250" />
    <line x1="350" y1="0" x2="350" y2="250" />
    <line x1="375" y1="0" x2="375" y2="250" />
  </g>

  <!-- Snake Border Walls -->
  <rect x="15" y="15" width="370" height="220" rx="10" fill="none" stroke="#1f2937" stroke-width="3" />

  <!-- The Snake Body with Neon Glow -->
  <g filter="url(#neon)">
    <!-- Tail Segments -->
    <rect x="77" y="152" width="21" height="21" rx="5" fill="#059669" />
    <rect x="102" y="152" width="21" height="21" rx="5" fill="#059669" />
    <rect x="127" y="152" width="21" height="21" rx="5" fill="#10b981" />
    <rect x="152" y="152" width="21" height="21" rx="5" fill="#10b981" />
    <rect x="152" y="127" width="21" height="21" rx="5" fill="#10b981" />
    <rect x="152" y="102" width="21" height="21" rx="5" fill="#34d399" />
    <rect x="177" y="102" width="21" height="21" rx="5" fill="#34d399" />
    <rect x="202" y="102" width="21" height="21" rx="5" fill="#34d399" />
    <rect x="227" y="102" width="21" height="21" rx="5" fill="#34d399" />
    <rect x="252" y="102" width="21" height="21" rx="5" fill="#34d399" />
    <rect x="252" y="77" width="21" height="21" rx="5" fill="#6ee7b7" />
    <rect x="277" y="77" width="21" height="21" rx="5" fill="#6ee7b7" />
    <!-- Snake Head -->
    <rect x="302" y="77" width="22" height="22" rx="6" fill="#a7f3d0" />
  </g>

  <!-- Snake Eyes -->
  <circle cx="316" cy="83" r="2.5" fill="#0f172a" />
  <circle cx="316" cy="93" r="2.5" fill="#0f172a" />
  <circle cx="317" cy="82.5" r="0.8" fill="#fff" />
  <circle cx="317" cy="92.5" r="0.8" fill="#fff" />

  <!-- Food Pellet / Red Glowing Apple -->
  <g filter="url(#appleGlow)">
    <circle cx="338" cy="138" r="10" fill="url(#foodGlow)" />
    <!-- stem -->
    <path d="M 338 128 Q 342 124 345 125" stroke="#10b981" stroke-width="2" fill="none" />
  </g>

  <!-- In-game Score HUD -->
  <rect x="30" y="28" width="105" height="32" rx="6" fill="#111827" stroke="#374151" stroke-width="1.5" />
  <text x="40" y="49" fill="#9ca3af" font-family="monospace" font-size="11" font-weight="700">SCORE:</text>
  <text x="92" y="50" fill="#34d399" font-family="monospace" font-size="15" font-weight="900">420</text>
</svg>
