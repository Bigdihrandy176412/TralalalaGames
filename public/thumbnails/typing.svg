<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceTyping" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="wordGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.8"/>
    </filter>
    <filter id="targetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#f59e0b" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Space with Grid Perspective -->
  <rect width="400" height="250" fill="url(#spaceTyping)" />

  <!-- Digital Grid perspective lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <line x1="200" y1="0" x2="20" y2="250" />
    <line x1="200" y1="0" x2="90" y2="250" />
    <line x1="200" y1="0" x2="160" y2="250" />
    <line x1="200" y1="0" x2="240" y2="250" />
    <line x1="200" y1="0" x2="310" y2="250" />
    <line x1="200" y1="0" x2="380" y2="250" />

    <line x1="140" y1="100" x2="260" y2="100" />
    <line x1="110" y1="140" x2="290" y2="140" />
    <line x1="70" y1="180" x2="330" y2="180" />
    <line x1="20" y1="220" x2="380" y2="220" />
  </g>

  <!-- Descending Words -->
  <!-- Word 1 (Top Left) -->
  <g transform="translate(60, 45)">
    <rect x="-10" y="-14" width="85" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="32" y="4" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">METEOR</text>
  </g>

  <!-- Word 2 (Top Right) -->
  <g transform="translate(260, 50)">
    <rect x="-10" y="-14" width="85" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="32" y="4" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">GALAXY</text>
  </g>

  <!-- Word 3 (Middle High Left) -->
  <g transform="translate(100, 100)">
    <rect x="-10" y="-14" width="95" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="37" y="4" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">VELOCITY</text>
  </g>

  <!-- Word 4 (Active Targeted Word - being typed right now!) -->
  <g transform="translate(190, 135)" filter="url(#targetGlow)">
    <rect x="-12" y="-16" width="125" height="30" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <!-- Already typed letters in glowing emerald -->
    <text x="50" y="5" font-family="monospace" font-size="15" font-weight="900" text-anchor="middle">
      <tspan fill="#10b981">LAS</tspan><tspan fill="#f59e0b">E</tspan><tspan fill="#64748b">R</tspan>
    </text>
  </g>

  <!-- Laser blast from defense turret pointing to targeted word -->
  <line x1="200" y1="210" x2="225" y2="155" stroke="#10b981" stroke-width="3" stroke-linecap="round" filter="url(#wordGlow)" />
  <circle cx="225" cy="155" r="5" fill="#a7f3d0" />

  <!-- Defense Cannon Turret at bottom -->
  <g transform="translate(200, 215)">
    <!-- Base -->
    <rect x="-35" y="5" width="70" height="20" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M -20 5 L 0 -15 L 20 5 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Dual barrels -->
    <rect x="-5" y="-22" width="4" height="15" fill="#38bdf8" />
    <rect x="2" y="-22" width="4" height="15" fill="#38bdf8" />
  </g>

  <!-- WPM & Accuracy Status Bar -->
  <rect x="20" y="15" width="115" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="77" y="32" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">SPEED: 78 WPM</text>

  <rect x="265" y="15" width="115" height="26" rx="5" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="322" y="32" fill="#10b981" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">ACCURACY: 98%</text>
</svg>
