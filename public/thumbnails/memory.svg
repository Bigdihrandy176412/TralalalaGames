<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="memBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="matchGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#10b981" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#memBg)" />

  <!-- 4 x 3 Card Grid -->
  <g transform="translate(45, 30)" filter="url(#cardShadow)">
    <!-- Row 1 -->
    <!-- Card 0,0: Back -->
    <rect x="0" y="0" width="68" height="58" rx="8" fill="url(#cardBack)" stroke="#60a5fa" stroke-width="1.5" />
    <circle cx="34" cy="29" r="12" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4,3" />

    <!-- Card 0,1: Revealed Match 1 (Gem!) -->
    <g filter="url(#matchGlow)">
      <rect x="80" y="0" width="68" height="58" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2" />
      <!-- Diamond Gem Icon -->
      <polygon points="114,14 128,26 114,44 100,26" fill="#38bdf8" stroke="#a5f3fc" stroke-width="1.5" />
      <polygon points="114,14 128,26 114,26 100,26" fill="#7dd3fc" />
    </g>

    <!-- Card 0,2: Back -->
    <rect x="160" y="0" width="68" height="58" rx="8" fill="url(#cardBack)" stroke="#60a5fa" stroke-width="1.5" />
    <circle cx="194" cy="29" r="12" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4,3" />

    <!-- Card 0,3: Revealed Match 1 (Gem Match!) -->
    <g filter="url(#matchGlow)">
      <rect x="240" y="0" width="68" height="58" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2" />
      <polygon points="274,14 288,26 274,44 260,26" fill="#38bdf8" stroke="#a5f3fc" stroke-width="1.5" />
      <polygon points="274,14 288,26 274,26 260,26" fill="#7dd3fc" />
    </g>

    <!-- Row 2 -->
    <!-- Card 1,0: Revealed Star -->
    <rect x="0" y="68" width="68" height="58" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <polygon points="34,80 38,90 49,91 40,98 43,109 34,103 25,109 28,98 19,91 30,90" fill="#facc15" stroke="#ca8a04" stroke-width="1" />

    <!-- Card 1,1: Back -->
    <rect x="80" y="68" width="68" height="58" rx="8" fill="url(#cardBack)" stroke="#60a5fa" stroke-width="1.5" />
    <circle cx="114" cy="97" r="12" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4,3" />

    <!-- Card 1,2: Revealed Heart -->
    <rect x="160" y="68" width="68" height="58" rx="8" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
    <path d="M 194 88 A 6 6 0 0 0 182 94 Q 182 104 194 114 Q 206 104 206 94 A 6 6 0 0 0 194 88 Z" fill="#f43f5e" stroke="#fda4af" stroke-width="1" />

    <!-- Card 1,3: Back -->
    <rect x="240" y="68" width="68" height="58" rx="8" fill="url(#cardBack)" stroke="#60a5fa" stroke-width="1.5" />
    <circle cx="274" cy="97" r="12" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4,3" />

    <!-- Row 3 -->
    <!-- Card 2,0: Back -->
    <rect x="0" y="136" width="68" height="58" rx="8" fill="url(#cardBack)" stroke="#60a5fa" stroke-width="1.5" />
    <circle cx="34" cy="165" r="12" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4,3" />

    <!-- Card 2,1: Revealed Star Match! -->
    <rect x="80" y="136" width="68" height="58" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <polygon points="114,148 118,158 129,159 120,166 123,177 114,171 105,177 108,166 99,159 110,158" fill="#facc15" stroke="#ca8a04" stroke-width="1" />

    <!-- Card 2,2: Back -->
    <rect x="160" y="136" width="68" height="58" rx="8" fill="url(#cardBack)" stroke="#60a5fa" stroke-width="1.5" />
    <circle cx="194" cy="165" r="12" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4,3" />

    <!-- Card 2,3: Back -->
    <rect x="240" y="136" width="68" height="58" rx="8" fill="url(#cardBack)" stroke="#60a5fa" stroke-width="1.5" />
    <circle cx="274" cy="165" r="12" fill="none" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4,3" />
  </g>

  <!-- Bottom Stats -->
  <text x="50" y="240" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="700">FLIPS: <tspan fill="#38bdf8">14</tspan></text>
  <text x="200" y="240" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">MATCHES: <tspan fill="#10b981">6 / 8</tspan></text>
  <text x="350" y="240" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="end">TIME: <tspan fill="#f59e0b">0:38</tspan></text>
</svg>
