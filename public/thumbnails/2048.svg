<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2048" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="tileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="250" fill="url(#bg2048)" />

  <!-- Game Board Frame -->
  <rect x="100" y="25" width="200" height="200" rx="12" fill="#334155" stroke="#475569" stroke-width="2" />

  <!-- Grid Cells -->
  <!-- Row 1 -->
  <rect x="110" y="35" width="40" height="40" rx="6" fill="#fbbf24" filter="url(#tileGlow)" />
  <text x="130" y="60" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="900" font-size="16" text-anchor="middle">2048</text>

  <rect x="155" y="35" width="40" height="40" rx="6" fill="#f59e0b" filter="url(#tileGlow)" />
  <text x="175" y="60" fill="#fff" font-family="system-ui, sans-serif" font-weight="800" font-size="16" text-anchor="middle">1024</text>

  <rect x="200" y="35" width="40" height="40" rx="6" fill="#ea580c" filter="url(#tileGlow)" />
  <text x="220" y="60" fill="#fff" font-family="system-ui, sans-serif" font-weight="800" font-size="17" text-anchor="middle">512</text>

  <rect x="245" y="35" width="40" height="40" rx="6" fill="#e11d48" filter="url(#tileGlow)" />
  <text x="265" y="60" fill="#fff" font-family="system-ui, sans-serif" font-weight="800" font-size="17" text-anchor="middle">256</text>

  <!-- Row 2 -->
  <rect x="110" y="80" width="40" height="40" rx="6" fill="#9333ea" filter="url(#tileGlow)" />
  <text x="130" y="105" fill="#fff" font-family="system-ui, sans-serif" font-weight="800" font-size="17" text-anchor="middle">128</text>

  <rect x="155" y="80" width="40" height="40" rx="6" fill="#6366f1" filter="url(#tileGlow)" />
  <text x="175" y="105" fill="#fff" font-family="system-ui, sans-serif" font-weight="800" font-size="18" text-anchor="middle">64</text>

  <rect x="200" y="80" width="40" height="40" rx="6" fill="#0284c7" filter="url(#tileGlow)" />
  <text x="220" y="105" fill="#fff" font-family="system-ui, sans-serif" font-weight="800" font-size="18" text-anchor="middle">32</text>

  <rect x="245" y="80" width="40" height="40" rx="6" fill="#0d9488" filter="url(#tileGlow)" />
  <text x="265" y="105" fill="#fff" font-family="system-ui, sans-serif" font-weight="800" font-size="18" text-anchor="middle">16</text>

  <!-- Row 3 -->
  <rect x="110" y="125" width="40" height="40" rx="6" fill="#16a34a" filter="url(#tileGlow)" />
  <text x="130" y="151" fill="#fff" font-family="system-ui, sans-serif" font-weight="800" font-size="20" text-anchor="middle">8</text>

  <rect x="155" y="125" width="40" height="40" rx="6" fill="#eab308" filter="url(#tileGlow)" />
  <text x="175" y="151" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="800" font-size="20" text-anchor="middle">4</text>

  <rect x="200" y="125" width="40" height="40" rx="6" fill="#cbd5e1" filter="url(#tileGlow)" />
  <text x="220" y="151" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="800" font-size="20" text-anchor="middle">2</text>

  <rect x="245" y="125" width="40" height="40" rx="6" fill="#1e293b" />

  <!-- Row 4 -->
  <rect x="110" y="170" width="40" height="40" rx="6" fill="#cbd5e1" filter="url(#tileGlow)" />
  <text x="130" y="196" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="800" font-size="20" text-anchor="middle">2</text>

  <rect x="155" y="170" width="40" height="40" rx="6" fill="#1e293b" />
  <rect x="200" y="170" width="40" height="40" rx="6" fill="#1e293b" />
  <rect x="245" y="170" width="40" height="40" rx="6" fill="#1e293b" />

  <!-- Side UI: Score badge -->
  <rect x="20" y="35" width="65" height="45" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="52" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle">SCORE</text>
  <text x="52" y="71" fill="#f59e0b" font-family="system-ui, sans-serif" font-weight="800" font-size="14" text-anchor="middle">24,810</text>

  <!-- Title Badge -->
  <text x="350" y="65" fill="#f59e0b" font-family="system-ui, sans-serif" font-weight="900" font-size="28" text-anchor="middle">2048</text>
  <text x="350" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-anchor="middle">SLIDE &amp; MERGE</text>
</svg>
