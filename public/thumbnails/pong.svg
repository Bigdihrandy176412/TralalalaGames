<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <filter id="pongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.9"/>
    </filter>
    <filter id="neonPink" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ec4899" flood-opacity="0.9"/>
    </filter>
    <filter id="ballTrail" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Dark Retro Synthwave Court -->
  <rect width="400" height="250" fill="#09090b" />

  <!-- Outer Arena Border -->
  <rect x="15" y="15" width="370" height="220" fill="none" stroke="#27272a" stroke-width="3" rx="10" />

  <!-- Dotted Center Divider Net -->
  <line x1="200" y1="20" x2="200" y2="230" stroke="#3f3f46" stroke-width="4" stroke-dasharray="10,12" />

  <!-- Retro Digital Scores -->
  <text x="140" y="70" fill="#06b6d4" font-family="'Courier New', Courier, monospace" font-size="44" font-weight="900" text-anchor="middle" filter="url(#pongGlow)">07</text>
  <text x="260" y="70" fill="#ec4899" font-family="'Courier New', Courier, monospace" font-size="44" font-weight="900" text-anchor="middle" filter="url(#neonPink)">05</text>

  <!-- Left Paddle (Player, Cyan) -->
  <rect x="35" y="90" width="12" height="65" rx="6" fill="#06b6d4" stroke="#a5f3fc" stroke-width="2" filter="url(#pongGlow)" />

  <!-- Right Paddle (AI, Pink) -->
  <rect x="353" y="115" width="12" height="65" rx="6" fill="#ec4899" stroke="#fbcfe8" stroke-width="2" filter="url(#neonPink)" />

  <!-- Fast Motion Trail for Ball -->
  <circle cx="120" cy="115" r="3" fill="#38bdf8" opacity="0.2" />
  <circle cx="150" cy="120" r="5" fill="#38bdf8" opacity="0.4" />
  <circle cx="185" cy="128" r="7" fill="#38bdf8" opacity="0.7" />

  <!-- Square/Round Pong Ball in Flight -->
  <circle cx="225" cy="138" r="9" fill="#ffffff" filter="url(#ballTrail)" />

  <!-- Velocity Vector Line -->
  <path d="M 47 122 L 225 138" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.4" />

  <!-- Corner accents -->
  <text x="40" y="222" fill="#71717a" font-family="monospace" font-size="10" font-weight="600">PLAYER 1</text>
  <text x="360" y="222" fill="#71717a" font-family="monospace" font-size="10" font-weight="600" text-anchor="end">CPU (EXPERT)</text>
</svg>
