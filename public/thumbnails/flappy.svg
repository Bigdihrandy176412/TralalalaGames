<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    
    <!-- Pipe Gradient -->
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="25%" stop-color="#4ade80" />
      <stop offset="75%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Pipe Highlight -->
    <linearGradient id="pipeRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="30%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="400" height="215" fill="url(#skyGrad)" />

  <!-- Pixel Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <!-- Cloud 1 -->
    <ellipse cx="60" cy="50" rx="35" ry="16" />
    <ellipse cx="85" cy="45" rx="25" ry="18" />
    <ellipse cx="40" cy="55" rx="20" ry="12" />

    <!-- Cloud 2 -->
    <ellipse cx="320" cy="70" rx="45" ry="18" />
    <ellipse cx="350" cy="62" rx="30" ry="20" />
    <ellipse cx="290" cy="75" rx="25" ry="14" />
  </g>

  <!-- Ground -->
  <rect x="0" y="215" width="400" height="35" fill="#ded895" stroke="#4d3200" stroke-width="2" />
  <!-- Grass strip on ground -->
  <rect x="0" y="215" width="400" height="7" fill="#73bf2e" />
  <line x1="0" y1="222" x2="400" y2="222" stroke="#558a22" stroke-width="2" />

  <!-- Pipe 1 (Top) -->
  <g filter="url(#shadow)">
    <rect x="80" y="0" width="52" height="70" fill="url(#pipeGrad)" stroke="#14532d" stroke-width="2.5" />
    <rect x="76" y="52" width="60" height="22" rx="2" fill="url(#pipeRim)" stroke="#14532d" stroke-width="2.5" />
  </g>

  <!-- Pipe 1 (Bottom) -->
  <g filter="url(#shadow)">
    <rect x="80" y="145" width="52" height="70" fill="url(#pipeGrad)" stroke="#14532d" stroke-width="2.5" />
    <rect x="76" y="145" width="60" height="22" rx="2" fill="url(#pipeRim)" stroke="#14532d" stroke-width="2.5" />
  </g>

  <!-- Pipe 2 (Top) -->
  <g filter="url(#shadow)">
    <rect x="290" y="0" width="52" height="105" fill="url(#pipeGrad)" stroke="#14532d" stroke-width="2.5" />
    <rect x="286" y="87" width="60" height="22" rx="2" fill="url(#pipeRim)" stroke="#14532d" stroke-width="2.5" />
  </g>

  <!-- Pipe 2 (Bottom) -->
  <g filter="url(#shadow)">
    <rect x="290" y="180" width="52" height="35" fill="url(#pipeGrad)" stroke="#14532d" stroke-width="2.5" />
    <rect x="286" y="180" width="60" height="22" rx="2" fill="url(#pipeRim)" stroke="#14532d" stroke-width="2.5" />
  </g>

  <!-- Flappy Bird (Animated Angle) -->
  <g transform="translate(195, 115) rotate(-15)" filter="url(#shadow)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="19" ry="15" fill="#facc15" stroke="#713f12" stroke-width="2.5" />
    <!-- White Belly -->
    <path d="M -12 6 Q 0 16 12 6 Z" fill="#fef08a" />
    <!-- Wing -->
    <ellipse cx="-4" cy="2" rx="9" ry="6" fill="#f59e0b" stroke="#713f12" stroke-width="2" />
    <!-- Eye White -->
    <ellipse cx="9" cy="-4" rx="6" ry="7" fill="#ffffff" stroke="#713f12" stroke-width="1.5" />
    <!-- Pupil -->
    <circle cx="11" cy="-4" r="2.8" fill="#000000" />
    <!-- Beak -->
    <path d="M 12 -1 L 24 3 L 12 7 Z" fill="#f97316" stroke="#713f12" stroke-width="2" />
    <!-- Wing motion lines -->
    <path d="M -15 -8 Q -10 -4 -8 0" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Score Counter in Middle -->
  <text x="200" y="55" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="40" text-anchor="middle" stroke="#000000" stroke-width="4" paint-order="stroke fill">18</text>
</svg>
