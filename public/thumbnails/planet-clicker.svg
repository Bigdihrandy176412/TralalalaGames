<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceDeep" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#030712" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <radialGradient id="planetGlow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0369a1" />
      <stop offset="90%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>
    <filter id="planetAtmo" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.8"/>
    </filter>
    <filter id="neonBeam" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10b981" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Deep Cosmic Canvas -->
  <rect width="400" height="250" fill="url(#spaceDeep)" />

  <!-- Distant Twinkling Stars -->
  <g fill="#ffffff">
    <circle cx="45" cy="35" r="1.5" opacity="0.8" />
    <circle cx="85" cy="95" r="1" opacity="0.5" />
    <circle cx="120" cy="20" r="1.2" opacity="0.6" />
    <circle cx="280" cy="40" r="1.5" opacity="0.9" />
    <circle cx="340" cy="80" r="1" opacity="0.4" />
    <circle cx="360" cy="25" r="1.8" opacity="0.8" />
    <circle cx="310" cy="180" r="1.2" opacity="0.6" />
    <circle cx="70" cy="210" r="1.5" opacity="0.7" />
    <circle cx="22" cy="150" r="1" opacity="0.5" />
    <circle cx="370" cy="215" r="1.5" opacity="0.7" />
  </g>

  <!-- Streak Meteor with Tail -->
  <line x1="330" y1="20" x2="270" y2="60" stroke="#facc15" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <circle cx="270" cy="60" r="2.5" fill="#ffffff" />

  <!-- Planetary Ring Back Segment -->
  <ellipse cx="180" cy="125" rx="120" ry="32" fill="none" stroke="#67e8f9" stroke-width="4" stroke-dasharray="160 220" opacity="0.4" transform="rotate(-18 180 125)" />

  <!-- Planet Orb -->
  <g transform="translate(180, 125)" filter="url(#planetAtmo)">
    <circle cx="0" cy="0" r="68" fill="url(#planetGlow)" />

    <!-- Continents / Atmosphere swirls -->
    <path d="M -38 -45 Q -10 -55 10 -40 Q 30 -30 20 -10 Q 0 -5 -15 -20 Z" fill="#10b981" opacity="0.6" />
    <path d="M -50 -10 Q -25 -20 -15 5 Q -5 30 -35 25 Q -55 20 -50 -10 Z" fill="#10b981" opacity="0.5" />
    <path d="M 5 5 Q 35 0 45 20 Q 30 45 10 35 Q -10 25 5 5 Z" fill="#10b981" opacity="0.55" />
    <path d="M -20 40 Q 15 35 25 55 Q 0 65 -20 40 Z" fill="#10b981" opacity="0.45" />

    <!-- Shading Crescent shadow on dark side -->
    <path d="M 0 -68 A 68 68 0 0 1 48 48 A 68 68 0 0 1 0 68 A 68 68 0 0 0 0 -68 Z" fill="#030712" opacity="0.4" />
  </g>

  <!-- Planetary Ring Front Segment -->
  <ellipse cx="180" cy="125" rx="120" ry="32" fill="none" stroke="#67e8f9" stroke-width="4" stroke-dasharray="220 160" opacity="0.85" transform="rotate(-18 180 125)" />

  <!-- Orbital Mining Satellite Station -->
  <g transform="translate(285, 90) rotate(25)">
    <!-- Main Body -->
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5" />
    <!-- Solar Panels -->
    <rect x="-24" y="-4" width="16" height="8" rx="1" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
    <rect x="8" y="-4" width="16" height="8" rx="1" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
    <circle cx="0" cy="0" r="2.5" fill="#10b981" />
  </g>

  <!-- Mining Energy Laser Beam hitting Planet -->
  <line x1="285" y1="90" x2="225" y2="120" stroke="#10b981" stroke-width="2.5" filter="url(#neonBeam)" stroke-linecap="round" />
  <circle cx="225" cy="120" r="5" fill="#a7f3d0" filter="url(#neonBeam)" />

  <!-- Click Pointer harvesting Energy -->
  <g transform="translate(145, 110) rotate(-10)" filter="url(#neonBeam)">
    <polygon points="0,0 0,28 7,21 14,34 19,31 12,18 22,18" fill="#ffffff" stroke="#0f172a" stroke-width="2" stroke-linejoin="round" />
  </g>

  <!-- Floating Energy Harvest Badge -->
  <g transform="translate(125, 60)" filter="url(#neonBeam)">
    <rect x="-8" y="-16" width="84" height="24" rx="6" fill="#090d16" stroke="#10b981" stroke-width="1.5" />
    <text x="34" y="1" fill="#10b981" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle">+500 TW</text>
  </g>

  <!-- Top Status Badge -->
  <rect x="20" y="16" width="140" height="34" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
  <text x="30" y="31" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="700">COLONIZED: EARTH</text>
  <text x="30" y="44" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="900">8.4B TW <tspan fill="#facc15" font-size="10">+94M/s</tspan></text>
</svg>
