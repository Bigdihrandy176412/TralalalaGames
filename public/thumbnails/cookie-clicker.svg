<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <radialGradient id="cookieBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="cookieDough" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="85%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
    <radialGradient id="chipGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#58240c" />
      <stop offset="70%" stop-color="#2c0f05" />
      <stop offset="100%" stop-color="#160703" />
    </radialGradient>
    <filter id="cookieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#facc15" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Dark Cosmic Bakery Background -->
  <rect width="400" height="250" fill="url(#cookieBg)" />

  <!-- Background Rays / Sparkles -->
  <g stroke="#f59e0b" stroke-width="1" opacity="0.15">
    <line x1="170" y1="125" x2="30" y2="20" />
    <line x1="170" y1="125" x2="100" y2="10" />
    <line x1="170" y1="125" x2="250" y2="10" />
    <line x1="170" y1="125" x2="340" y2="40" />
    <line x1="170" y1="125" x2="380" y2="120" />
    <line x1="170" y1="125" x2="340" y2="210" />
    <line x1="170" y1="125" x2="240" y2="240" />
    <line x1="170" y1="125" x2="90" y2="230" />
    <line x1="170" y1="125" x2="20" y2="170" />
  </g>

  <!-- Giant Cookie -->
  <g transform="translate(170, 125)" filter="url(#cookieShadow)">
    <!-- Base Cookie Body -->
    <circle cx="0" cy="0" r="74" fill="url(#cookieDough)" stroke="#b45309" stroke-width="3" />

    <!-- Organic Cookie edge ripples -->
    <circle cx="-62" cy="-25" r="14" fill="#b45309" opacity="0.4" />
    <circle cx="64" cy="18" r="12" fill="#78350f" opacity="0.4" />
    <circle cx="10" cy="68" r="13" fill="#78350f" opacity="0.4" />
    <circle cx="-15" cy="-68" r="12" fill="#d97706" opacity="0.4" />

    <!-- Chocolate Chips with Highlights -->
    <!-- Chip 1 -->
    <path d="M -32 -38 Q -20 -44 -16 -32 Q -12 -20 -24 -18 Q -38 -16 -32 -38 Z" fill="url(#chipGrad)" />
    <circle cx="-25" cy="-32" r="2.5" fill="#854d0e" opacity="0.7" />

    <!-- Chip 2 -->
    <path d="M 12 -42 Q 28 -40 32 -28 Q 30 -14 18 -18 Q 8 -24 12 -42 Z" fill="url(#chipGrad)" />
    <circle cx="22" cy="-30" r="2" fill="#854d0e" opacity="0.7" />

    <!-- Chip 3 (Center) -->
    <path d="M -10 -6 Q 6 -12 12 2 Q 10 16 -4 14 Q -16 10 -10 -6 Z" fill="url(#chipGrad)" />
    <circle cx="0" cy="3" r="2.5" fill="#854d0e" opacity="0.7" />

    <!-- Chip 4 -->
    <path d="M 28 8 Q 44 4 46 20 Q 38 32 26 26 Q 18 20 28 8 Z" fill="url(#chipGrad)" />

    <!-- Chip 5 -->
    <path d="M -44 8 Q -28 4 -26 22 Q -30 36 -42 30 Q -52 22 -44 8 Z" fill="url(#chipGrad)" />

    <!-- Chip 6 -->
    <path d="M -8 34 Q 8 28 14 42 Q 6 54 -6 50 Q -18 44 -8 34 Z" fill="url(#chipGrad)" />

    <!-- Tiny Chunks -->
    <circle cx="42" cy="-12" r="4.5" fill="#2c0f05" />
    <circle cx="-38" cy="-12" r="4" fill="#2c0f05" />
    <circle cx="34" cy="42" r="4.5" fill="#2c0f05" />
    <circle cx="-30" cy="40" r="3.5" fill="#2c0f05" />
  </g>

  <!-- Crumb Particles blasting off -->
  <g fill="#d97706">
    <circle cx="75" cy="80" r="3" />
    <circle cx="62" cy="140" r="2.5" />
    <circle cx="95" cy="180" r="3.5" />
    <circle cx="250" cy="50" r="2.5" />
    <circle cx="265" cy="185" r="3" />
  </g>

  <!-- White Mouse Pointer Clicking the Cookie -->
  <g transform="translate(210, 140) rotate(-15)" filter="url(#goldGlow)">
    <polygon points="0,0 0,32 8,24 16,38 22,34 14,20 25,20" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" />
  </g>

  <!-- Floating Click Value (+77) -->
  <g transform="translate(230, 95)" filter="url(#goldGlow)">
    <rect x="-6" y="-18" width="62" height="26" rx="6" fill="#0f172a" stroke="#facc15" stroke-width="1.5" />
    <text x="25" y="0" fill="#facc15" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">+999</text>
  </g>

  <!-- Mini Golden Cookie in top corner -->
  <g transform="translate(345, 45)" filter="url(#goldGlow)">
    <circle cx="0" cy="0" r="18" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
    <circle cx="-5" cy="-6" r="2.5" fill="#78350f" />
    <circle cx="6" cy="-4" r="2" fill="#78350f" />
    <circle cx="-2" cy="5" r="2" fill="#78350f" />
    <circle cx="5" cy="4" r="2" fill="#78350f" />
  </g>

  <!-- HUD Overlay -->
  <rect x="18" y="16" width="130" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="28" y="32" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="700">COOKIES</text>
  <text x="28" y="44" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="900">14.8M <tspan fill="#10b981" font-size="10">+42k/s</tspan></text>
</svg>
