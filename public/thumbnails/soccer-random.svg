<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="pitchSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="pitchGrass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <radialGradient id="soccerBallGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>
  </defs>

  <!-- Sky & Stadium -->
  <rect width="400" height="160" fill="url(#pitchSky)" />
  <rect y="160" width="400" height="90" fill="url(#pitchGrass)" />

  <!-- Goal Post (Left) -->
  <rect x="0" y="70" width="45" height="100" fill="none" stroke="#ffffff" stroke-width="4" />
  <!-- Net grid -->
  <line x1="0" y1="90" x2="45" y2="90" stroke="#f1f5f9" stroke-width="1.5" opacity="0.6" />
  <line x1="0" y1="115" x2="45" y2="115" stroke="#f1f5f9" stroke-width="1.5" opacity="0.6" />
  <line x1="0" y1="140" x2="45" y2="140" stroke="#f1f5f9" stroke-width="1.5" opacity="0.6" />
  <line x1="15" y1="70" x2="15" y2="170" stroke="#f1f5f9" stroke-width="1.5" opacity="0.6" />
  <line x1="30" y1="70" x2="30" y2="170" stroke="#f1f5f9" stroke-width="1.5" opacity="0.6" />

  <!-- Ragdoll Player 1 (Kicking floppy leg) -->
  <g transform="translate(130, 95) rotate(-15)">
    <!-- Head -->
    <rect x="0" y="0" width="18" height="20" rx="3" fill="#f87171" />
    <rect x="12" y="5" width="4" height="4" fill="#1e293b" />
    <!-- Torso -->
    <rect x="-4" y="20" width="26" height="30" rx="2" fill="#ef4444" />
    <!-- Arm flailing -->
    <rect x="-16" y="22" width="14" height="8" rx="2" fill="#fca5a5" transform="rotate(-35)" />
    <!-- Legs ragdoll kicked up -->
    <rect x="2" y="50" width="8" height="25" rx="2" fill="#1e293b" transform="rotate(50 6 50)" />
    <rect x="14" y="50" width="8" height="25" rx="2" fill="#1e293b" transform="rotate(-20 18 50)" />
    <!-- Shoes -->
    <circle cx="28" cy="74" r="5" fill="#facc15" />
    <circle cx="9" cy="74" r="5" fill="#facc15" />
  </g>

  <!-- Soccer Ball with Pentagon Pattern in Mid-Air -->
  <g transform="translate(205, 120)">
    <circle cx="0" cy="0" r="18" fill="url(#soccerBallGrad)" stroke="#334155" stroke-width="1.5" />
    <polygon points="0,-7 6,-2 4,5 -4,5 -6,-2" fill="#1e293b" />
    <line x1="0" y1="-7" x2="0" y2="-17" stroke="#334155" stroke-width="1.5" />
    <line x1="6" y1="-2" x2="15" y2="-6" stroke="#334155" stroke-width="1.5" />
    <line x1="4" y1="5" x2="12" y2="13" stroke="#334155" stroke-width="1.5" />
    <line x1="-4" y1="5" x2="-12" y2="13" stroke="#334155" stroke-width="1.5" />
    <line x1="-6" y1="-2" x2="-15" y2="-6" stroke="#334155" stroke-width="1.5" />
  </g>

  <!-- Ragdoll Player 2 (Diving blue goalie/striker) -->
  <g transform="translate(270, 110) rotate(25)">
    <!-- Head -->
    <rect x="0" y="0" width="18" height="20" rx="3" fill="#60a5fa" />
    <rect x="2" y="5" width="4" height="4" fill="#1e293b" />
    <!-- Torso -->
    <rect x="-4" y="20" width="26" height="30" rx="2" fill="#2563eb" />
    <!-- Arm extended -->
    <rect x="20" y="22" width="18" height="8" rx="2" fill="#93c5fd" transform="rotate(-40)" />
    <!-- Legs flailing -->
    <rect x="2" y="50" width="8" height="25" rx="2" fill="#ffffff" transform="rotate(-45 6 50)" />
    <rect x="14" y="50" width="8" height="25" rx="2" fill="#ffffff" transform="rotate(30 18 50)" />
    <!-- Shoes -->
    <circle cx="-12" cy="70" r="5" fill="#f97316" />
    <circle cx="28" cy="72" r="5" fill="#f97316" />
  </g>

  <!-- Title Badge -->
  <rect x="14" y="14" width="155" height="28" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="2" />
  <text x="91" y="33" fill="#38bdf8" font-size="13" font-family="system-ui, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">SOCCER RANDOM</text>

  <rect x="295" y="14" width="90" height="22" rx="4" fill="#0369a1" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" />
  <text x="340" y="29" fill="#e0f2fe" font-size="10" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">REAL GAME</text>
</svg>
