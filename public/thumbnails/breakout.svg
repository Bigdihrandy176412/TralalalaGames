<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <radialGradient id="ballGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>
    <filter id="glowBall" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.9"/>
    </filter>
    <filter id="paddleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#10b981" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="250" fill="#090d16" />

  <!-- Side Borders -->
  <rect x="10" y="10" width="380" height="230" fill="none" stroke="#1e293b" stroke-width="4" rx="8" />

  <!-- Brick Grid (Breakout Rows) -->
  <!-- Red Row -->
  <g fill="#ef4444" stroke="#991b1b" stroke-width="1.5">
    <rect x="25" y="30" width="41" height="14" rx="2" />
    <rect x="71" y="30" width="41" height="14" rx="2" />
    <rect x="117" y="30" width="41" height="14" rx="2" />
    <rect x="163" y="30" width="41" height="14" rx="2" opacity="0.3" stroke-dasharray="2" /> <!-- Hit brick -->
    <rect x="209" y="30" width="41" height="14" rx="2" />
    <rect x="255" y="30" width="41" height="14" rx="2" />
    <rect x="301" y="30" width="41" height="14" rx="2" />
    <rect x="347" y="30" width="28" height="14" rx="2" />
  </g>

  <!-- Orange Row -->
  <g fill="#f97316" stroke="#9a3412" stroke-width="1.5">
    <rect x="25" y="48" width="41" height="14" rx="2" />
    <rect x="71" y="48" width="41" height="14" rx="2" />
    <rect x="117" y="48" width="41" height="14" rx="2" />
    <!-- Smashed gap -->
    <rect x="209" y="48" width="41" height="14" rx="2" />
    <rect x="255" y="48" width="41" height="14" rx="2" />
    <rect x="301" y="48" width="41" height="14" rx="2" />
    <rect x="347" y="48" width="28" height="14" rx="2" />
  </g>

  <!-- Yellow Row -->
  <g fill="#eab308" stroke="#854d0e" stroke-width="1.5">
    <rect x="25" y="66" width="41" height="14" rx="2" />
    <rect x="71" y="66" width="41" height="14" rx="2" />
    <rect x="117" y="66" width="41" height="14" rx="2" />
    <rect x="163" y="66" width="41" height="14" rx="2" />
    <rect x="209" y="66" width="41" height="14" rx="2" />
    <rect x="255" y="66" width="41" height="14" rx="2" />
    <rect x="301" y="66" width="41" height="14" rx="2" />
    <rect x="347" y="66" width="28" height="14" rx="2" />
  </g>

  <!-- Green Row -->
  <g fill="#22c55e" stroke="#166534" stroke-width="1.5">
    <rect x="25" y="84" width="41" height="14" rx="2" />
    <rect x="71" y="84" width="41" height="14" rx="2" />
    <!-- smashed gap -->
    <rect x="163" y="84" width="41" height="14" rx="2" />
    <rect x="209" y="84" width="41" height="14" rx="2" />
    <rect x="255" y="84" width="41" height="14" rx="2" />
    <rect x="301" y="84" width="41" height="14" rx="2" />
    <rect x="347" y="84" width="28" height="14" rx="2" />
  </g>

  <!-- Cyan/Blue Row -->
  <g fill="#06b6d4" stroke="#155e75" stroke-width="1.5">
    <rect x="25" y="102" width="41" height="14" rx="2" />
    <rect x="71" y="102" width="41" height="14" rx="2" />
    <rect x="117" y="102" width="41" height="14" rx="2" />
    <rect x="163" y="102" width="41" height="14" rx="2" />
    <rect x="209" y="102" width="41" height="14" rx="2" />
    <rect x="255" y="102" width="41" height="14" rx="2" />
    <rect x="301" y="102" width="41" height="14" rx="2" />
    <rect x="347" y="102" width="28" height="14" rx="2" />
  </g>

  <!-- Brick Shatter Sparks -->
  <g fill="#f59e0b">
    <circle cx="160" cy="78" r="2.5" />
    <circle cx="152" cy="85" r="2" />
    <circle cx="170" cy="88" r="3" />
    <circle cx="165" cy="94" r="1.5" />
  </g>

  <!-- Ball Trail -->
  <path d="M 210 215 L 175 145 L 160 85" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" opacity="0.5" fill="none" />

  <!-- Ball with Glow -->
  <g filter="url(#glowBall)">
    <circle cx="170" cy="135" r="7" fill="url(#ballGlow)" />
  </g>

  <!-- Paddle -->
  <g filter="url(#paddleGlow)">
    <rect x="165" y="218" width="75" height="12" rx="6" fill="#10b981" stroke="#a7f3d0" stroke-width="1.5" />
    <circle cx="175" cy="224" r="2" fill="#fff" />
    <circle cx="230" cy="224" r="2" fill="#fff" />
  </g>

  <!-- In-game UI -->
  <text x="30" y="24" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="700">SCORE: <tspan fill="#38bdf8">1,840</tspan></text>
  <text x="360" y="24" fill="#ef4444" font-family="sans-serif" font-size="12" text-anchor="end">❤️❤️❤️</text>
</svg>
