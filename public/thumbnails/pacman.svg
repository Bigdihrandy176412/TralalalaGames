<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <filter id="pacGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#facc15" flood-opacity="0.8"/>
    </filter>
    <filter id="ghostGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ef4444" flood-opacity="0.8"/>
    </filter>
    <filter id="pelletGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#fef08a" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Black Arcade Maze Canvas -->
  <rect width="400" height="250" fill="#000000" />

  <!-- Neon Blue Labyrinth Walls -->
  <g stroke="#2563eb" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Border Walls -->
    <rect x="15" y="15" width="370" height="220" rx="8" />

    <!-- Top Labyrinth structures -->
    <path d="M 50 50 L 110 50 L 110 90" />
    <path d="M 150 50 L 250 50" />
    <path d="M 290 50 L 350 50 L 350 90" />

    <!-- Center T-block -->
    <path d="M 200 50 L 200 110" />

    <!-- Left & Right bays -->
    <path d="M 15 125 L 80 125 L 80 165" />
    <path d="M 385 125 L 320 125 L 320 165" />

    <!-- Ghost House Box in center -->
    <rect x="150" y="140" width="100" height="50" rx="4" />
    <!-- Ghost House Door -->
    <line x1="185" y1="140" x2="215" y2="140" stroke="#f472b6" stroke-width="3" />

    <!-- Bottom Obstacles -->
    <path d="M 50 195 L 110 195" />
    <path d="M 290 195 L 350 195" />
    <path d="M 200 190 L 200 235" />
  </g>

  <!-- Food Pellets (Dots along corridors) -->
  <g fill="#fef08a">
    <circle cx="35" cy="35" r="3" />
    <circle cx="65" cy="35" r="3" />
    <circle cx="95" cy="35" r="3" />
    <circle cx="125" cy="35" r="3" />
    <circle cx="275" cy="35" r="3" />
    <circle cx="305" cy="35" r="3" />
    <circle cx="335" cy="35" r="3" />
    <circle cx="365" cy="35" r="3" />

    <!-- Vertical corridor pellets -->
    <circle cx="125" cy="65" r="3" />
    <circle cx="125" cy="95" r="3" />
    <circle cx="125" cy="125" r="3" />
    <circle cx="125" cy="155" r="3" />
    <circle cx="125" cy="185" r="3" />

    <circle cx="275" cy="65" r="3" />
    <circle cx="275" cy="95" r="3" />
    <circle cx="275" cy="125" r="3" />
    <circle cx="275" cy="155" r="3" />
    <circle cx="275" cy="185" r="3" />
  </g>

  <!-- Big Glowing Power Pellet! -->
  <circle cx="35" cy="85" r="7" fill="#ffffff" filter="url(#pelletGlow)" />
  <circle cx="365" cy="85" r="7" fill="#ffffff" filter="url(#pelletGlow)" />

  <!-- Pac-Man (Yellow Chomper moving right, eating dots) -->
  <g transform="translate(195, 85)" filter="url(#pacGlow)">
    <path d="M 0 0 L 17 -13 A 22 22 0 1 0 17 13 Z" fill="#facc15" />
    <!-- Eye -->
    <circle cx="2" cy="-11" r="2.5" fill="#000" />
  </g>

  <!-- Red Ghost (Blinky - Chasing Pacman!) -->
  <g transform="translate(115, 85)" filter="url(#ghostGlow)" fill="#ef4444">
    <!-- Dome Top & Base with tentacles -->
    <path d="M -16 6 A 16 16 0 0 1 16 6 L 16 18 L 10 14 L 5 18 L 0 14 L -5 18 L -10 14 L -16 18 Z" />
    <!-- Eyes -->
    <ellipse cx="-6" cy="3" rx="5" ry="6" fill="#fff" />
    <circle cx="-4" cy="3" r="2.5" fill="#1d4ed8" /> <!-- Looking right -->
    <ellipse cx="6" cy="3" rx="5" ry="6" fill="#fff" />
    <circle cx="8" cy="3" r="2.5" fill="#1d4ed8" />
  </g>

  <!-- Cyan Ghost (Inky - Inside or emerging from house) -->
  <g transform="translate(180, 165)" fill="#06b6d4">
    <path d="M -14 4 A 14 14 0 0 1 14 4 L 14 15 L 9 12 L 4 15 L 0 12 L -4 15 L -9 12 L -14 15 Z" />
    <ellipse cx="-5" cy="2" rx="4" ry="5" fill="#fff" />
    <circle cx="-5" cy="0" r="2" fill="#1e3a8a" />
    <ellipse cx="5" cy="2" rx="4" ry="5" fill="#fff" />
    <circle cx="5" cy="0" r="2" fill="#1e3a8a" />
  </g>

  <!-- Pink Ghost (Pinky) -->
  <g transform="translate(220, 165)" fill="#ec4899">
    <path d="M -14 4 A 14 14 0 0 1 14 4 L 14 15 L 9 12 L 4 15 L 0 12 L -4 15 L -9 12 L -14 15 Z" />
    <ellipse cx="-5" cy="2" rx="4" ry="5" fill="#fff" />
    <circle cx="-5" cy="0" r="2" fill="#1e3a8a" />
    <ellipse cx="5" cy="2" rx="4" ry="5" fill="#fff" />
    <circle cx="5" cy="0" r="2" fill="#1e3a8a" />
  </g>

  <!-- HUD: Score and Lives -->
  <text x="35" y="228" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700">1UP <tspan fill="#facc15">7,420</tspan></text>
  <text x="365" y="228" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">HIGH <tspan fill="#facc15">32,800</tspan></text>
</svg>
