<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2048 Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 400px;
      margin-bottom: 16px;
    }
    .title { font-size: 2.25rem; font-weight: 800; color: #f59e0b; }
    .scores { display: flex; gap: 8px; }
    .score-box {
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #334155;
    }
    .score-label { font-size: 0.7rem; text-transform: uppercase; color: #94a3b8; font-weight: 600; }
    .score-val { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .grid-container {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1 / 1;
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 12px;
      position: relative;
      border: 2px solid #334155;
      touch-action: none;
    }
    .cell {
      background: #334155;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      font-weight: 800;
      color: #fff;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .cell[data-val="2"] { background: #475569; color: #f8fafc; }
    .cell[data-val="4"] { background: #64748b; color: #f8fafc; }
    .cell[data-val="8"] { background: #f97316; color: #ffffff; }
    .cell[data-val="16"] { background: #ea580c; color: #ffffff; }
    .cell[data-val="32"] { background: #f43f5e; color: #ffffff; }
    .cell[data-val="64"] { background: #e11d48; color: #ffffff; }
    .cell[data-val="128"] { background: #eab308; color: #1e293b; font-size: 1.5rem; }
    .cell[data-val="256"] { background: #facc15; color: #1e293b; font-size: 1.5rem; }
    .cell[data-val="512"] { background: #10b981; color: #ffffff; font-size: 1.5rem; }
    .cell[data-val="1024"] { background: #06b6d4; color: #ffffff; font-size: 1.2rem; }
    .cell[data-val="2048"] { background: #8b5cf6; color: #ffffff; font-size: 1.2rem; box-shadow: 0 0 15px #8b5cf6; }
    .controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 400px;
      margin-top: 16px;
      align-items: center;
    }
    .hint { font-size: 0.85rem; color: #94a3b8; }
    .btn {
      background: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn:hover { background: #fbbf24; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.92);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }
    .overlay h2 { font-size: 2rem; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">Score</div>
        <div id="score" class="score-val">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Best</div>
        <div id="best" class="score-val">0</div>
      </div>
    </div>
  </div>

  <div class="grid-container" id="grid">
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">Game Over!</h2>
      <button class="btn" onclick="initGame()">Try Again</button>
    </div>
  </div>

  <div class="controls">
    <span class="hint">Use Arrow Keys, WASD, or Swipe</span>
    <button class="btn" onclick="initGame()">Restart</button>
  </div>

  <script>
    let board = [];
    let score = 0;
    let best = localStorage.getItem('2048_best') || 0;
    document.getElementById('best').textContent = best;

    const gridEl = document.getElementById('grid');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');

    function createBoard() {
      for (let i = 0; i < 16; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = 'cell-' + i;
        gridEl.appendChild(cell);
      }
    }

    function initGame() {
      board = Array(16).fill(0);
      score = 0;
      updateScore(0);
      overlay.classList.remove('active');
      addRandomTile();
      addRandomTile();
      render();
    }

    function addRandomTile() {
      const emptyCells = [];
      board.forEach((val, idx) => { if (val === 0) emptyCells.push(idx); });
      if (emptyCells.length === 0) return;
      const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
      board[randomCell] = Math.random() < 0.9 ? 2 : 4;
    }

    function render() {
      for (let i = 0; i < 16; i++) {
        const cell = document.getElementById('cell-' + i);
        const val = board[i];
        cell.textContent = val > 0 ? val : '';
        cell.setAttribute('data-val', val);
      }
    }

    function updateScore(inc) {
      score += inc;
      document.getElementById('score').textContent = score;
      if (score > best) {
        best = score;
        localStorage.setItem('2048_best', best);
        document.getElementById('best').textContent = best;
      }
    }

    function slide(row) {
      let arr = row.filter(val => val);
      let gained = 0;
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2;
          gained += arr[i];
          arr[i + 1] = 0;
        }
      }
      arr = arr.filter(val => val);
      while (arr.length < 4) arr.push(0);
      return { row: arr, score: gained };
    }

    function moveLeft() {
      let moved = false;
      for (let i = 0; i < 4; i++) {
        let row = board.slice(i * 4, i * 4 + 4);
        let res = slide(row);
        for (let j = 0; j < 4; j++) {
          if (board[i * 4 + j] !== res.row[j]) moved = true;
          board[i * 4 + j] = res.row[j];
        }
        updateScore(res.score);
      }
      return moved;
    }

    function moveRight() {
      let moved = false;
      for (let i = 0; i < 4; i++) {
        let row = board.slice(i * 4, i * 4 + 4).reverse();
        let res = slide(row);
        res.row.reverse();
        for (let j = 0; j < 4; j++) {
          if (board[i * 4 + j] !== res.row[j]) moved = true;
          board[i * 4 + j] = res.row[j];
        }
        updateScore(res.score);
      }
      return moved;
    }

    function moveUp() {
      let moved = false;
      for (let c = 0; c < 4; c++) {
        let col = [board[c], board[c + 4], board[c + 8], board[c + 12]];
        let res = slide(col);
        for (let r = 0; r < 4; r++) {
          if (board[r * 4 + c] !== res.row[r]) moved = true;
          board[r * 4 + c] = res.row[r];
        }
        updateScore(res.score);
      }
      return moved;
    }

    function moveDown() {
      let moved = false;
      for (let c = 0; c < 4; c++) {
        let col = [board[c], board[c + 4], board[c + 8], board[c + 12]].reverse();
        let res = slide(col);
        res.row.reverse();
        for (let r = 0; r < 4; r++) {
          if (board[r * 4 + c] !== res.row[r]) moved = true;
          board[r * 4 + c] = res.row[r];
        }
        updateScore(res.score);
      }
      return moved;
    }

    function checkGameOver() {
      if (board.includes(0)) return;
      for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 4; j++) {
          let curr = board[i * 4 + j];
          if (j < 3 && curr === board[i * 4 + j + 1]) return;
          if (i < 3 && curr === board[(i + 1) * 4 + j]) return;
        }
      }
      overlayTitle.textContent = "Game Over!";
      overlay.classList.add('active');
    }

    function handleInput(dir) {
      let moved = false;
      if (dir === 'left') moved = moveLeft();
      else if (dir === 'right') moved = moveRight();
      else if (dir === 'up') moved = moveUp();
      else if (dir === 'down') moved = moveDown();

      if (moved) {
        addRandomTile();
        render();
        checkGameOver();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); handleInput('up'); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); handleInput('down'); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); handleInput('left'); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); handleInput('right'); }
    });

    // Touch support
    let touchStartX = 0, touchStartY = 0;
    gridEl.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    gridEl.addEventListener('touchend', e => {
      let dx = e.changedTouches[0].clientX - touchStartX;
      let dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
        handleInput(dx > 0 ? 'right' : 'left');
      } else if (Math.abs(dy) > 30) {
        handleInput(dy > 0 ? 'down' : 'up');
      }
    }, { passive: true });

    createBoard();
    initGame();
  </script>
</body>
</html>
