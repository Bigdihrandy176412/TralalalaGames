<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Memory Match - Unblocked</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 12px;
    }
    .game-card-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #020617;
      padding: 10px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      border: 1px solid #1e293b;
      font-family: monospace;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 10px;
      perspective: 800px;
    }
    .card {
      aspect-ratio: 1 / 1;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.4s ease;
    }
    .card.flipped {
      transform: rotateY(180deg);
    }
    .card.matched .front {
      background: #064e3b;
      border-color: #10b981;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }
    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 2px solid #334155;
      font-size: 1.8rem;
    }
    .back {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #38bdf8;
    }
    .back::after {
      content: '?';
      font-size: 1.4rem;
      font-weight: 900;
      color: #64748b;
    }
    .front {
      background: #020617;
      transform: rotateY(180deg);
      border-color: #38bdf8;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
    }
    .hidden { display: none !important; }
    .btn {
      background: #38bdf8;
      color: #030712;
      border: none;
      padding: 10px 24px;
      font-size: 0.95rem;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { background: #7dd3fc; transform: scale(1.04); }
  </style>
</head>
<body>

  <div class="game-card-wrapper">
    <div class="stats-bar">
      <div>FLIPS: <span id="flipCount" style="color: #38bdf8;">0</span></div>
      <div>MATCHES: <span id="matchCount" style="color: #10b981;">0 / 8</span></div>
      <div>TIME: <span id="timeVal" style="color: #facc15;">0:00</span></div>
    </div>

    <div class="grid" id="cardGrid"></div>

    <div id="winOverlay" class="overlay hidden">
      <h2 style="font-size: 1.8rem; font-weight: 900; color: #10b981;">PUZZLE SOLVED!</h2>
      <div id="starRating" style="font-size: 1.6rem; color: #facc15;">⭐⭐⭐</div>
      <p style="font-size: 0.85rem; color: #cbd5e1;">You matched all pairs in <strong id="winFlips" style="color: #38bdf8;">0</strong> flips (<span id="winTime">0:00</span>)!</p>
      <button id="playAgainBtn" class="btn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const ICONS = ['💎', '🎮', '⭐', '💖', '⚡', '👑', '🚀', '🍀'];
    const cardGrid = document.getElementById('cardGrid');
    const flipCountEl = document.getElementById('flipCount');
    const matchCountEl = document.getElementById('matchCount');
    const timeValEl = document.getElementById('timeVal');
    const winOverlay = document.getElementById('winOverlay');
    const winFlips = document.getElementById('winFlips');
    const winTime = document.getElementById('winTime');
    const starRating = document.getElementById('starRating');
    const playAgainBtn = document.getElementById('playAgainBtn');

    let audioCtx = null;
    function playBeep(freq, type = 'sine', duration = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    let cards = [];
    let flippedCards = [];
    let flips = 0;
    let matches = 0;
    let timer = 0;
    let timerInterval = null;
    let isLocked = false;

    function initGame() {
      // Clear
      cardGrid.innerHTML = '';
      flips = 0;
      matches = 0;
      flippedCards = [];
      isLocked = false;
      flipCountEl.innerText = '0';
      matchCountEl.innerText = '0 / 8';
      timeValEl.innerText = '0:00';
      winOverlay.classList.add('hidden');

      // Shuffle 8 pairs
      const deck = [...ICONS, ...ICONS].sort(() => Math.random() - 0.5);

      deck.forEach((icon, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.icon = icon;
        card.dataset.index = index;

        card.innerHTML = `
          <div class="card-face back"></div>
          <div class="card-face front">${icon}</div>
        `;

        card.addEventListener('click', () => onCardClick(card));
        cardGrid.appendChild(card);
      });

      // Timer
      clearInterval(timerInterval);
      timer = 0;
      timerInterval = setInterval(() => {
        timer++;
        const mins = Math.floor(timer / 60);
        const secs = timer % 60;
        timeValEl.innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
      }, 1000);
    }

    function onCardClick(card) {
      if (isLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;

      playBeep(440, 'sine', 0.05);
      card.classList.add('flipped');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        flips++;
        flipCountEl.innerText = flips;
        checkMatch();
      }
    }

    function checkMatch() {
      isLocked = true;
      const [c1, c2] = flippedCards;

      if (c1.dataset.icon === c2.dataset.icon) {
        // Match!
        setTimeout(() => {
          c1.classList.add('matched');
          c2.classList.add('matched');
          matches++;
          matchCountEl.innerText = `${matches} / 8`;
          playBeep(660, 'triangle', 0.15);
          flippedCards = [];
          isLocked = false;

          if (matches === 8) {
            clearInterval(timerInterval);
            setTimeout(onWin, 400);
          }
        }, 300);
      } else {
        // No match
        setTimeout(() => {
          c1.classList.remove('flipped');
          c2.classList.remove('flipped');
          flippedCards = [];
          isLocked = false;
        }, 850);
      }
    }

    function onWin() {
      playBeep(880, 'sine', 0.25);
      winFlips.innerText = flips;
      winTime.innerText = timeValEl.innerText;

      if (flips <= 18) {
        starRating.innerText = '⭐⭐⭐';
      } else if (flips <= 26) {
        starRating.innerText = '⭐⭐';
      } else {
        starRating.innerText = '⭐';
      }

      winOverlay.classList.remove('hidden');
    }

    playAgainBtn.addEventListener('click', initGame);
    initGame();
  </script>
</body>
</html>
