<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Pong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .score-board {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 520px;
      margin-bottom: 12px;
      font-size: 1.5rem;
      font-weight: 800;
    }
    .score-item { text-align: center; }
    .label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
    .wrap {
      position: relative;
      border: 3px solid #6366f1;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.25);
    }
    canvas { display: block; background: #030712; cursor: none; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .btn {
      background: #6366f1;
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
    }
    .hint { margin-top: 12px; font-size: 0.85rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="score-board">
    <div class="score-item">
      <div class="label">Player</div>
      <div id="pScore" style="color: #6366f1;">0</div>
    </div>
    <div class="score-item">
      <div class="label">CPU</div>
      <div id="cScore" style="color: #ef4444;">0</div>
    </div>
  </div>

  <div class="wrap">
    <canvas id="canvas" width="520" height="360"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle" style="font-size: 2rem; color: #6366f1;">CYBER PONG</h2>
      <p style="color: #cbd5e1;">First to 7 points wins!</p>
      <button class="btn" onclick="start()">SERVE BALL</button>
    </div>
  </div>

  <div class="hint">Move mouse or W/S to move left paddle</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const pScoreEl = document.getElementById('pScore');
    const cScoreEl = document.getElementById('cScore');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ovTitle');

    let player = { y: 140, width: 12, height: 75, speed: 6 };
    let cpu = { y: 140, width: 12, height: 75, speed: 3.8 };
    let ball = { x: 260, y: 180, r: 6, vx: 5, vy: 3 };
    let pScore = 0;
    let cScore = 0;
    let active = false;

    function start() {
      pScore = 0;
      cScore = 0;
      pScoreEl.textContent = 0;
      cScoreEl.textContent = 0;
      resetBall(1);
      active = true;
      overlay.classList.remove('show');
    }

    function resetBall(dir) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.vx = 4.5 * dir;
      ball.vy = (Math.random() * 4 - 2);
    }

    function update() {
      if (!active) return;

      // Ball Movement
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top/Bottom bounce
      if (ball.y - ball.r < 0 || ball.y + ball.r > canvas.height) {
        ball.vy = -ball.vy;
      }

      // Player Paddle Collision
      if (ball.x - ball.r < player.width + 15 && ball.x + ball.r > 15) {
        if (ball.y > player.y && ball.y < player.y + player.height) {
          ball.vx = Math.abs(ball.vx) * 1.05;
          let offset = (ball.y - (player.y + player.height / 2)) / (player.height / 2);
          ball.vy = offset * 5;
        }
      }

      // CPU Paddle Collision
      if (ball.x + ball.r > canvas.width - cpu.width - 15 && ball.x - ball.r < canvas.width - 15) {
        if (ball.y > cpu.y && ball.y < cpu.y + cpu.height) {
          ball.vx = -Math.abs(ball.vx) * 1.05;
          let offset = (ball.y - (cpu.y + cpu.height / 2)) / (cpu.height / 2);
          ball.vy = offset * 5;
        }
      }

      // CPU AI tracking
      let targetY = ball.y - cpu.height / 2;
      if (cpu.y < targetY) cpu.y += cpu.speed;
      else if (cpu.y > targetY) cpu.y -= cpu.speed;

      // Point scoring
      if (ball.x < 0) {
        cScore++;
        cScoreEl.textContent = cScore;
        checkWin();
        resetBall(1);
      } else if (ball.x > canvas.width) {
        pScore++;
        pScoreEl.textContent = pScore;
        checkWin();
        resetBall(-1);
      }
    }

    function checkWin() {
      if (pScore >= 7 || cScore >= 7) {
        active = false;
        ovTitle.textContent = pScore >= 7 ? "YOU WIN!" : "CPU WINS!";
        overlay.classList.add('show');
      }
    }

    function draw() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dotted line
      ctx.strokeStyle = '#1e293b';
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Player
      ctx.fillStyle = '#6366f1';
      ctx.shadowColor = '#6366f1';
      ctx.shadowBlur = 10;
      ctx.fillRect(15, player.y, player.width, player.height);

      // CPU
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 10;
      ctx.fillRect(canvas.width - cpu.width - 15, cpu.y, cpu.width, cpu.height);

      // Ball
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener('mousemove', e => {
      let rect = canvas.getBoundingClientRect();
      let my = e.clientY - rect.top;
      player.y = Math.max(0, Math.min(canvas.height - player.height, my - player.height / 2));
    });

    window.addEventListener('keydown', e => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') player.y = Math.max(0, player.y - 20);
      if (e.code === 'KeyS' || e.code === 'ArrowDown') player.y = Math.min(canvas.height - player.height, player.y + 20);
    });

    overlay.classList.add('show');
    loop();
  </script>
</body>
</html>
