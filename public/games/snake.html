<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #00ffcc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 440px;
      margin-bottom: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
    }
    .board-wrap {
      position: relative;
      border: 3px solid #00ffcc;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.25), inset 0 0 20px rgba(0, 255, 204, 0.1);
      background: #050810;
    }
    canvas {
      display: block;
      width: 420px;
      height: 420px;
      max-width: 90vw;
      max-height: 90vw;
    }
    .game-over-screen {
      position: absolute;
      inset: 0;
      background: rgba(5, 8, 16, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .game-over-screen.show {
      opacity: 1;
      pointer-events: auto;
    }
    .btn {
      background: #00ffcc;
      color: #050810;
      border: none;
      padding: 10px 24px;
      font-weight: 800;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
    }
    .btn:hover { background: #5cffee; }
    .controls-hint {
      margin-top: 14px;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div>SCORE: <span id="score">0</span></div>
    <div>HIGH: <span id="high">0</span></div>
  </div>

  <div class="board-wrap">
    <canvas id="canvas" width="400" height="400"></canvas>
    <div class="game-over-screen" id="gameOver">
      <h2 style="font-size: 2rem; color: #ff0055; text-shadow: 0 0 12px #ff0055;">GAME OVER</h2>
      <p style="color: #cbd5e1;">Final Score: <span id="finalScore">0</span></p>
      <button class="btn" onclick="startGame()">PLAY AGAIN</button>
    </div>
  </div>

  <div class="controls-hint">Use Arrow Keys or WASD to navigate</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highEl = document.getElementById('high');
    const gameOverEl = document.getElementById('gameOver');
    const finalScoreEl = document.getElementById('finalScore');

    const GRID_SIZE = 20;
    const TILE_COUNT = 20;

    let snake = [];
    let food = { x: 15, y: 15 };
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    let highScore = localStorage.getItem('snake_high') || 0;
    let gameInterval = null;
    highEl.textContent = highScore;

    function startGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      scoreEl.textContent = 0;
      gameOverEl.classList.remove('show');
      spawnFood();
      clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, 95);
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * TILE_COUNT),
        y: Math.floor(Math.random() * TILE_COUNT)
      };
      for (let segment of snake) {
        if (segment.x === food.x && segment.y === food.y) {
          return spawnFood();
        }
      }
    }

    function gameLoop() {
      dx = nextDx;
      dy = nextDy;
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        endGame();
        return;
      }

      // Self collision
      for (let seg of snake) {
        if (seg.x === head.x && seg.y === head.y) {
          endGame();
          return;
        }
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > highScore) {
          highScore = score;
          highEl.textContent = highScore;
          localStorage.setItem('snake_high', highScore);
        }
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#050810';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Grid Subtle
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += GRID_SIZE) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
      }

      // Draw Food
      ctx.fillStyle = '#ff0055';
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(food.x * GRID_SIZE + GRID_SIZE/2, food.y * GRID_SIZE + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Draw Snake
      snake.forEach((seg, index) => {
        ctx.fillStyle = index === 0 ? '#00ffcc' : '#00bfa5';
        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = index === 0 ? 10 : 4;
        ctx.fillRect(seg.x * GRID_SIZE + 1, seg.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
      });

      ctx.shadowBlur = 0;
    }

    function endGame() {
      clearInterval(gameInterval);
      finalScoreEl.textContent = score;
      gameOverEl.classList.add('show');
    }

    window.addEventListener('keydown', (e) => {
      if ((e.code === 'ArrowUp' || e.code === 'KeyW') && dy === 0) {
        nextDx = 0; nextDy = -1; e.preventDefault();
      } else if ((e.code === 'ArrowDown' || e.code === 'KeyS') && dy === 0) {
        nextDx = 0; nextDy = 1; e.preventDefault();
      } else if ((e.code === 'ArrowLeft' || e.code === 'KeyA') && dx === 0) {
        nextDx = -1; nextDy = 0; e.preventDefault();
      } else if ((e.code === 'ArrowRight' || e.code === 'KeyD') && dx === 0) {
        nextDx = 1; nextDy = 0; e.preventDefault();
      }
    });

    startGame();
  </script>
</body>
</html>
